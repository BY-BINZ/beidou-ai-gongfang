# 北斗AI工坊 docker-compose（部署在小炳哥服务器上，由 Grok Bot 安装）
#
# 部署步骤见 HANDOFF.md，简述：
#   1. cp .env.example .env，填好 3 个值（数据库密码、Redis 密码、SESSION_SECRET）
#   2. docker compose up -d
#   3. 打开 https://api.beidouku.com，按设置向导建立管理员账号
#
# 注意：
# - 镜像固定 v1.0.0-rc.51，不要改成 latest（版本升级要先在测试环境验证）。
# - 所有密码、SESSION_SECRET 都从 .env 读，文件里不写真实值；没填会直接报错停住。
# - 宝塔反代：域名 api.beidouku.com → http://127.0.0.1:3000，要开 WebSocket/流式转发
#   （proxy_http_version 1.1 + Upgrade/Connection 头），上传限额建议 client_max_body_size 100m。
# - 数据在 pg_data 卷 + ./data 目录；备份见 HANDOFF.md。

services:
  new-api:
    image: calciumion/new-api:v1.0.0-rc.51
    container_name: beidou-gongfang
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}@postgres:5432/beidou-gongfang
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?请在 .env 里设置 REDIS_PASSWORD}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=beidou-gongfang-1
      - DEFAULT_LANGUAGE=zh-CN
      - SESSION_SECRET=${SESSION_SECRET:?请在 .env 里设置 SESSION_SECRET（随机长字符串）}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://api.beidouku.com
#      - TRUSTED_PROXIES=172.20.0.0/16  # 只有反代不在本机/不在信任网段时才需要按实际网段填
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时（秒），默认 120；空补全可调大
#      - LOG_SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/beidou-gongfang-log  # 可选：日志单独库
    depends_on:
      - redis
      - postgres
    networks:
      - beidou-gongfang-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: beidou-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 里设置 REDIS_PASSWORD}"]
    networks:
      - beidou-gongfang-network

  postgres:
    image: postgres:15
    container_name: beidou-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: beidou-gongfang
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - beidou-gongfang-network

volumes:
  pg_data:

networks:
  beidou-gongfang-network:
    driver: bridge
